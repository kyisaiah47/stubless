name: gates
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # No `npm install` step on purpose: if this ever needs one, the zero-dependency
      # claim in the README has quietly stopped being true.
      - name: offline suite
        run: bash test/run.sh

  self-check:
    # The action runs on its own repository. AGENTS.md says this holds it to a threshold
    # of 90, and it would be a poor joke to ship a stub AGENTS.md here.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          threshold: '90'
